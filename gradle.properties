# Force Gradle to use a specific JDK install (adjust to your scoop path)
# Replace the path below with the result of `scoop prefix openjdk` or `scoop prefix temurin`
# Example: C:\\Users\\green\\scoop\\apps\\openjdk\\current
org.gradle.java.home=C:/Users/green/scoop/apps/openjdk21/current

# Kotlin jvm target validation behavior (avoid failing on mismatched jvm targets during dev)
kotlin.jvm.target.validation.mode=warning

# Avoid including kotlin data directory in VCS by default (local convenience)
kotlin.project.persistent.dir=.kotlin
